name: Scrape tier1 cities
on:
  schedule:
    - cron: "15 5,17 * * *"
  workflow_dispatch:

jobs:
  sale-multi-portal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        city:
          - barcelona
          - madrid
          - valencia
          - sevilla
          - malaga
          - bilbao
          - zaragoza
          - murcia
          - gijon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - name: Sale (pisos + Fotocasa + Hipoges/Solvia/Kelify)
        run: node -e "import { runCitySaleIngest } from './scripts/scrapers/lib/run-city-sale-ingest.mjs'; console.log(JSON.stringify(await runCitySaleIngest(process.env.CITY_SLUG), null, 2));"
        env:
          CITY_SLUG: ${{ matrix.city }}
          MAX_LISTINGS: "500"
          PISOS_MAX_PAGES: "40"
          FOTOCASA_MAX_PAGES: "18"
          FOTOCASA_PER_ZONE: "350"
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Rent (pisos)
        run: node scripts/scrapers/pisos-rent-city.mjs
        env:
          CITY_SLUG: ${{ matrix.city }}
          MAX_LISTINGS: "120"
          PISOS_MAX_PAGES: "20"
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
