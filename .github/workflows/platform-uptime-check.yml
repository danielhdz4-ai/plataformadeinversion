name: Platform uptime check
on:
  schedule:
    # Cada 2 h — latido + aviso si prod/Supabase caen
    - cron: "15 */2 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping producción (/api/ping + /api/health)
        run: node scripts/jobs/platform-uptime-check.mjs
        env:
          PLATFORM_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}